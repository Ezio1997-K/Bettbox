name: Build isolated patched Windows dev bundle

on:
  workflow_dispatch:
  push:
    branches:
      - fix/core-lifecycle-mihomo-20260801

permissions:
  contents: read

concurrency:
  group: patched-windows-dev-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none

jobs:
  build-windows-x64:
    name: Windows x64 unsigned isolated dev bundle
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-windows-amd64-${{ hashFiles('**/pubspec.lock') }}

      # Keep this aligned with the Windows preparation in the upstream build.
      - name: Prepare Windows Go dependency
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Preparing ${FILE}"
          chmod +w "${FILE}"

      - name: Resolve Flutter dependencies and generators
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run build_runner build -d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build isolated Dev Core
        shell: pwsh
        run: |
          dart setup.dart windows --arch amd64 --out core-only --dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'libclash/windows/BettboxDevCore.exe' -PathType Leaf)) {
            throw 'BettboxDevCore.exe was not produced.'
          }
          $coreHash = (Get-FileHash -LiteralPath 'libclash/windows/BettboxDevCore.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Dev Core SHA256: $coreHash"

      - name: Build matching isolated Dev HelperService
        shell: pwsh
        run: |
          dart setup.dart windows --arch amd64 --out helper --core-hash $env:CORE_SHA256 --dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'libclash/windows/BettboxDevHelperService.exe' -PathType Leaf)) {
            throw 'BettboxDevHelperService.exe was not produced.'
          }
          $postHelperCoreHash = (Get-FileHash -LiteralPath 'libclash/windows/BettboxDevCore.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($postHelperCoreHash -ne $env:CORE_SHA256) {
            throw "Dev Core changed while building Dev HelperService: expected $env:CORE_SHA256, got $postHelperCoreHash"
          }

      - name: Build matching isolated Bettbox Dev app
        shell: pwsh
        run: |
          # The existing Windows CMake project enables BETTBOX_DEV for the
          # Debug configuration, matching the APP_DEV Dart identity below.
          $flutterArgs = @(
            'build', 'windows', '--debug', '--verbose',
            "--dart-define=CORE_SHA256=$env:CORE_SHA256",
            '--dart-define=APP_DEV=true',
            '--dart-define=APP_ENV=pre',
            '--dart-define=APP_ASSET_SUFFIX=windows-amd64-dev-test.zip'
          )
          flutter @flutterArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify complete isolated Dev bundle
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Debug'
          $requiredFiles = @(
            'Bettbox.exe',
            'BettboxDevCore.exe',
            'BettboxDevHelperService.exe'
          )
          foreach ($name in $requiredFiles) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required bundle file: $path"
            }
          }
          foreach ($name in @('BettboxCore.exe', 'BettboxHelperService.exe')) {
            $path = Join-Path $releaseDir $name
            if (Test-Path -LiteralPath $path) {
              throw "Production-identity binary leaked into isolated Dev bundle: $path"
            }
          }
          $bundledCoreHash = (Get-FileHash -LiteralPath (Join-Path $releaseDir 'BettboxDevCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundledCoreHash -ne $env:CORE_SHA256) {
            throw "Bundled Dev Core hash mismatch: expected $env:CORE_SHA256, got $bundledCoreHash"
          }
          Get-ChildItem -LiteralPath $releaseDir -File | Sort-Object Name | Select-Object Name, Length

      - name: Upload unsigned isolated Dev bundle
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-patched-dev-windows-x64-${{ github.sha }}
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
